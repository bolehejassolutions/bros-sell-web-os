name: Production public browser smoke
on:
  push:
    branches: ['verify/production-913ea4c']
    paths: ['.github/workflows/production-smoke.yml', 'tests/production-public-smoke.ts']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies and browser
        run: |
          npm install --global npm@11.9.0
          npm ci
          git diff --exit-code -- package.json package-lock.json
          npx --no-install playwright install --with-deps chromium
      - name: Read-only real Production browser smoke
        run: node --experimental-strip-types tests/production-public-smoke.ts
      - name: Preserve Production screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-public-smoke-913ea4c
          path: test-results/
          retention-days: 7
